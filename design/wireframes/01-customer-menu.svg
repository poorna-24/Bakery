<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1000" viewBox="0 0 390 1000" font-family="Arial, Helvetica, sans-serif">
  <title>01 Customer · Menu</title>
  <rect width="390" height="1000" fill="#fdf6ec"/>

  <!-- Offer strip -->
  <g id="offer-strip">
    <rect width="390" height="50" fill="#B3261E"/>
    <text x="195" y="22" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Diwali special — 20% off all sweets</text>
    <text x="195" y="39" font-size="10" fill="#ffffff" text-anchor="middle">Till 5 November, on orders above ₹500</text>
  </g>

  <!-- Sticky header -->
  <g id="header">
    <rect y="50" width="390" height="56" fill="#fdf6ec"/>
    <circle cx="356" cy="78" r="17" fill="#ffffff" stroke="#eaddc9"/>
    <circle cx="353" cy="75" r="6" fill="none" stroke="#3a2418" stroke-width="2"/>
    <line x1="357" y1="79" x2="362" y2="84" stroke="#3a2418" stroke-width="2"/>
  </g>

  <!-- Hero -->
  <g id="hero">
    <text x="195" y="140" font-size="28" font-weight="900" fill="#3a2418" text-anchor="middle">BAKERY NAME</text>
    <line x1="140" y1="158" x2="185" y2="158" stroke="#b4741f"/>
    <rect x="190" y="153" width="10" height="10" fill="#b4741f" transform="rotate(45 195 158)"/>
    <line x1="205" y1="158" x2="250" y2="158" stroke="#b4741f"/>
    <text x="195" y="186" font-size="13" fill="#8a7663" text-anchor="middle">Freshly baked every morning.</text>
    <rect x="90" y="200" width="210" height="28" rx="14" fill="#ffffff" stroke="#eaddc9"/>
    <circle cx="106" cy="214" r="4" fill="#15803d"/>
    <text x="116" y="218" font-size="11" font-weight="700" fill="#15803d">OPEN NOW</text>
    <text x="180" y="218" font-size="11" fill="#8a7663">|  7:00 am – 9:00 pm</text>
  </g>

  <!-- Menu / Order tabs -->
  <g id="tabs">
    <rect x="45" y="244" width="300" height="42" rx="21" fill="#ffffff" stroke="#eaddc9"/>
    <rect x="49" y="248" width="120" height="34" rx="17" fill="#b4741f"/>
    <text x="109" y="270" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Menu</text>
    <circle cx="188" cy="265" r="7" fill="#25D366"/>
    <text x="263" y="270" font-size="13" font-weight="700" fill="#3a2418" text-anchor="middle">Order on WhatsApp</text>
    <circle cx="338" cy="248" r="10" fill="#b4741f" stroke="#ffffff" stroke-width="2"/>
    <text x="338" y="252" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  <!-- Category chips -->
  <g id="chips" font-size="12">
    <rect x="16" y="304" width="70" height="30" rx="15" fill="#b4741f"/>
    <text x="51" y="323" fill="#ffffff" text-anchor="middle" font-weight="700">Cakes</text>
    <rect x="94" y="304" width="80" height="30" rx="15" fill="#ffffff" stroke="#eaddc9"/>
    <text x="134" y="323" fill="#3a2418" text-anchor="middle">Pastries</text>
    <rect x="182" y="304" width="74" height="30" rx="15" fill="#ffffff" stroke="#eaddc9"/>
    <text x="219" y="323" fill="#3a2418" text-anchor="middle">Breads</text>
    <rect x="264" y="304" width="76" height="30" rx="15" fill="#ffffff" stroke="#eaddc9"/>
    <text x="302" y="323" fill="#3a2418" text-anchor="middle">Snacks</text>
    <rect x="348" y="304" width="60" height="30" rx="15" fill="#ffffff" stroke="#eaddc9"/>
    <text x="370" y="323" fill="#3a2418">Sw…</text>
  </g>

  <!-- Category heading -->
  <rect x="16" y="352" width="4" height="36" fill="#b4741f"/>
  <text x="28" y="368" font-size="19" font-weight="800" fill="#3a2418">Cakes</text>
  <text x="28" y="385" font-size="12" fill="#8a7663">Made fresh every morning</text>

  <!-- Item cards: 2 columns on phone (3 on tablet, 4 on desktop) -->
  <g id="card-1">
    <rect x="16" y="402" width="171" height="236" rx="12" fill="#ffffff" stroke="#eaddc9"/>
    <rect x="16" y="402" width="171" height="171" rx="12" fill="#eee5d8"/>
    <line x1="16" y1="402" x2="187" y2="573" stroke="#d6c7b2"/><line x1="187" y1="402" x2="16" y2="573" stroke="#d6c7b2"/>
    <rect x="24" y="410" width="88" height="18" rx="9" fill="#fef3c7"/>
    <text x="68" y="423" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">★ BESTSELLER</text>
    <rect x="26" y="586" width="10" height="10" fill="none" stroke="#15803d" stroke-width="1.5"/><circle cx="31" cy="591" r="2.5" fill="#15803d"/>
    <text x="42" y="595" font-size="13" font-weight="700" fill="#3a2418">Choco Truffle Cake</text>
    <text x="26" y="622" font-size="13" font-weight="700" fill="#b4741f">₹450 – ₹850</text>
  </g>
  <g id="card-2">
    <rect x="203" y="402" width="171" height="236" rx="12" fill="#ffffff" stroke="#eaddc9"/>
    <rect x="203" y="402" width="171" height="171" rx="12" fill="#eee5d8"/>
    <line x1="203" y1="402" x2="374" y2="573" stroke="#d6c7b2"/><line x1="374" y1="402" x2="203" y2="573" stroke="#d6c7b2"/>
    <rect x="211" y="410" width="66" height="18" rx="9" fill="#dcfce7"/>
    <text x="244" y="423" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">EGGLESS</text>
    <rect x="213" y="586" width="10" height="10" fill="none" stroke="#15803d" stroke-width="1.5"/><circle cx="218" cy="591" r="2.5" fill="#15803d"/>
    <text x="229" y="595" font-size="13" font-weight="700" fill="#3a2418">Black Forest Cake</text>
    <text x="213" y="622" font-size="13" font-weight="700" fill="#b4741f">₹400 – ₹780</text>
  </g>
  <g id="card-3">
    <rect x="16" y="654" width="171" height="236" rx="12" fill="#ffffff" stroke="#eaddc9"/>
    <rect x="16" y="654" width="171" height="171" rx="12" fill="#eee5d8"/>
    <line x1="16" y1="654" x2="187" y2="825" stroke="#d6c7b2"/><line x1="187" y1="654" x2="16" y2="825" stroke="#d6c7b2"/>
    <rect x="26" y="838" width="10" height="10" fill="none" stroke="#15803d" stroke-width="1.5"/><circle cx="31" cy="843" r="2.5" fill="#15803d"/>
    <text x="42" y="847" font-size="13" font-weight="700" fill="#3a2418">Pineapple Cake</text>
    <text x="26" y="874" font-size="13" font-weight="700" fill="#b4741f">₹380 – ₹700</text>
  </g>
  <g id="card-4-sold-out">
    <rect x="203" y="654" width="171" height="236" rx="12" fill="#ffffff" stroke="#eaddc9"/>
    <rect x="203" y="654" width="171" height="171" rx="12" fill="#6b5f55"/>
    <rect x="248" y="728" width="80" height="24" rx="12" fill="#ffffff"/>
    <text x="288" y="744" font-size="11" font-weight="700" fill="#3a2418" text-anchor="middle">Sold out</text>
    <rect x="213" y="838" width="10" height="10" fill="none" stroke="#b91c1c" stroke-width="1.5"/><circle cx="218" cy="843" r="2.5" fill="#b91c1c"/>
    <text x="229" y="847" font-size="13" font-weight="700" fill="#3a2418">Red Velvet Cake</text>
    <text x="213" y="874" font-size="13" font-weight="700" fill="#b4741f">₹500 – ₹950</text>
  </g>

  <!-- Quiet cart bar (Menu tab) -->
  <g id="cart-bar-quiet">
    <rect x="80" y="930" width="230" height="44" rx="22" fill="#ffffff" stroke="#b4741f" stroke-width="1.5"/>
    <text x="104" y="957" font-size="13" fill="#3a2418">2 items · ₹730</text>
    <text x="290" y="957" font-size="13" font-weight="700" fill="#b4741f" text-anchor="end">View order</text>
  </g>
</svg>
