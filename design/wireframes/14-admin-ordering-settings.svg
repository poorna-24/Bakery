<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1260" viewBox="0 0 390 1260" font-family="Arial, Helvetica, sans-serif">
  <title>14 Admin · Ordering settings</title>
  <rect width="390" height="1260" fill="#f7f4ef"/>

  <g id="admin-header">
    <rect width="390" height="104" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="16" y="34" font-size="14" font-weight="800" fill="#b4741f" letter-spacing="1.5">BAKERY NAME ADMIN</text>
    <rect x="296" y="14" width="78" height="30" rx="8" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="335" y="34" font-size="12" fill="#2b1e14" text-anchor="middle">Sign out</text>
    <g font-size="12">
      <rect x="16" y="60" width="56" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="44" y="79" fill="#2b1e14" text-anchor="middle">Menu</text>
      <rect x="78" y="60" width="62" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="109" y="79" fill="#2b1e14" text-anchor="middle">Orders</text>
      <rect x="146" y="60" width="60" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="176" y="79" fill="#2b1e14" text-anchor="middle">Offers</text>
      <rect x="212" y="60" width="56" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="240" y="79" fill="#2b1e14" text-anchor="middle">Hours</text>
      <rect x="274" y="60" width="72" height="30" rx="15" fill="#b4741f"/><text x="310" y="79" fill="#ffffff" text-anchor="middle" font-weight="700">Ordering</text>
      <rect x="352" y="60" width="90" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="362" y="79" fill="#2b1e14">Appear…</text>
    </g>
  </g>

  <text x="16" y="134" font-size="12" fill="#b4741f">← All categories</text>
  <text x="16" y="168" font-size="26" font-weight="800" fill="#2b1e14">Ordering</text>

  <rect x="16" y="184" width="358" height="34" rx="17" fill="#dcfce7"/>
  <text x="32" y="206" font-size="12" fill="#15803d"><tspan font-weight="700">Ordering is on</tspan> · orders go to +91 98765 43210</text>

  <rect x="16" y="232" width="358" height="76" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
  <rect x="32" y="250" width="20" height="20" rx="4" fill="#b4741f"/>
  <text x="64" y="265" font-size="14" font-weight="700" fill="#2b1e14">Take orders on WhatsApp</text>
  <text x="64" y="285" font-size="11" fill="#7a6a5b">On: the menu gets two tabs — Menu and Order.</text>

  <!-- Ways to order -->
  <rect x="16" y="322" width="358" height="282" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
  <text x="32" y="350" font-size="11" font-weight="700" fill="#7a6a5b" letter-spacing="1">WAYS TO ORDER</text>
  <g font-size="13">
    <rect x="32" y="360" width="326" height="88" rx="10" fill="#ffffff" stroke="#e5dcd0"/>
    <rect x="44" y="374" width="16" height="16" rx="3" fill="#b4741f"/>
    <text x="70" y="387" font-weight="700" fill="#2b1e14">I'm at a table</text>
    <text x="70" y="405" font-size="11" fill="#7a6a5b">We'll bring it to you</text>
    <text x="70" y="434" font-size="12" fill="#2b1e14">Number of tables</text>
    <rect x="186" y="416" width="70" height="28" rx="8" fill="#ffffff" stroke="#e5dcd0"/><text x="198" y="435" font-size="12" fill="#2b1e14">12</text>
    <rect x="32" y="456" width="326" height="44" rx="10" fill="#ffffff" stroke="#e5dcd0"/>
    <rect x="44" y="470" width="16" height="16" rx="3" fill="#b4741f"/><text x="70" y="483" font-weight="700" fill="#2b1e14">I'm at the counter</text>
    <rect x="32" y="508" width="326" height="44" rx="10" fill="#ffffff" stroke="#e5dcd0"/>
    <rect x="44" y="522" width="16" height="16" rx="3" fill="#b4741f"/><text x="70" y="535" font-weight="700" fill="#2b1e14">Pick up later</text>
    <rect x="32" y="560" width="326" height="36" rx="10" fill="#ffffff" stroke="#e5dcd0"/>
    <rect x="44" y="570" width="16" height="16" rx="3" fill="#ffffff" stroke="#e5dcd0"/><text x="70" y="583" font-weight="700" fill="#2b1e14">Delivery</text>
  </g>

  <!-- Number, minimum, hours -->
  <rect x="16" y="618" width="358" height="262" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
  <g font-size="11" font-weight="700" fill="#7a6a5b" letter-spacing="1">
    <text x="32" y="646">SEND ORDERS TO (WHATSAPP NUMBER)</text>
    <text x="32" y="730">MINIMUM ORDER (₹)</text>
  </g>
  <rect x="32" y="654" width="326" height="40" rx="10" fill="#ffffff" stroke="#e5dcd0"/><text x="44" y="679" font-size="13" fill="#2b1e14">+91 98765 43210</text>
  <text x="32" y="712" font-size="10" fill="#7a6a5b">Orders open as a WhatsApp chat with this number.</text>
  <rect x="32" y="738" width="150" height="40" rx="10" fill="#ffffff" stroke="#e5dcd0"/><text x="44" y="763" font-size="13" fill="#b9a892">0</text>
  <text x="32" y="796" font-size="10" fill="#7a6a5b">Leave empty or 0 for no minimum.</text>
  <rect x="32" y="816" width="18" height="18" rx="4" fill="#b4741f"/>
  <text x="60" y="830" font-size="13" font-weight="700" fill="#2b1e14">Only accept orders while the shop is open</text>
  <text x="60" y="848" font-size="10" fill="#7a6a5b">Uses your Shop hours.</text>

  <!-- Payment -->
  <rect x="16" y="894" width="358" height="290" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
  <text x="32" y="922" font-size="11" font-weight="700" fill="#7a6a5b" letter-spacing="1">PAYMENT</text>
  <text x="32" y="946" font-size="12" fill="#2b1e14">Ways customers can pay</text>
  <g font-size="12">
    <rect x="32" y="956" width="74" height="32" rx="16" fill="#b4741f"/><text x="69" y="977" fill="#ffffff" text-anchor="middle" font-weight="700">✓ Cash</text>
    <rect x="112" y="956" width="186" height="32" rx="16" fill="#b4741f"/><text x="205" y="977" fill="#ffffff" text-anchor="middle" font-weight="700">✓ UPI (GPay / PhonePe / Paytm)</text>
    <rect x="304" y="956" width="54" height="32" rx="16" fill="#ffffff" stroke="#e5dcd0"/><text x="331" y="977" fill="#2b1e14" text-anchor="middle">Card</text>
  </g>
  <text x="32" y="1014" font-size="11" font-weight="700" fill="#7a6a5b" letter-spacing="1">YOUR UPI ID</text>
  <rect x="32" y="1022" width="326" height="40" rx="10" fill="#ffffff" stroke="#e5dcd0"/><text x="44" y="1047" font-size="13" fill="#b9a892">shivambakery@okaxis</text>
  <text x="32" y="1088" font-size="11" font-weight="700" fill="#7a6a5b" letter-spacing="1">YOUR UPI QR CODE (OPTIONAL)</text>
  <rect x="32" y="1098" width="64" height="64" rx="8" fill="#ffffff" stroke="#2b1e14"/>
  <rect x="40" y="1106" width="16" height="16" fill="#2b1e14"/><rect x="72" y="1106" width="16" height="16" fill="#2b1e14"/><rect x="40" y="1138" width="16" height="16" fill="#2b1e14"/>
  <rect x="108" y="1100" width="16" height="16" rx="3" fill="#ffffff" stroke="#e5dcd0"/><text x="132" y="1113" font-size="12" fill="#2b1e14">Remove this QR</text>
  <rect x="108" y="1126" width="100" height="30" rx="8" fill="#ffffff" stroke="#e5dcd0"/><text x="158" y="1146" font-size="12" fill="#2b1e14" text-anchor="middle">Choose file</text>

  <rect x="16" y="1198" width="220" height="44" rx="10" fill="#b4741f"/>
  <text x="126" y="1225" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Save ordering settings</text>
</svg>
