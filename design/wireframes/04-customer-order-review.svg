<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1240" viewBox="0 0 390 1240" font-family="Arial, Helvetica, sans-serif">
  <title>04 Customer · Review and send order</title>
  <rect width="390" height="1240" fill="#3a2418" opacity="0.55"/>
  <rect x="0" y="40" width="390" height="1220" rx="24" fill="#ffffff"/>
  <rect x="175" y="52" width="40" height="5" rx="2.5" fill="#eaddc9"/>

  <text x="16" y="96" font-size="22" font-weight="800" fill="#3a2418">Your order</text>

  <!-- Lines -->
  <rect x="16" y="112" width="358" height="190" rx="12" fill="#ffffff" stroke="#eaddc9"/>
  <g font-size="13">
    <text x="30" y="140" font-weight="700" fill="#3a2418">Choco Truffle Cake</text>
    <text x="30" y="158" font-size="11" fill="#8a7663">500 g · ₹450 each</text>
    <rect x="232" y="132" width="78" height="28" rx="14" fill="#ffffff" stroke="#eaddc9"/>
    <text x="246" y="151" fill="#3a2418" text-anchor="middle">−</text><text x="271" y="151" fill="#3a2418" text-anchor="middle">1</text><text x="296" y="151" fill="#3a2418" text-anchor="middle">+</text>
    <text x="360" y="151" font-weight="700" fill="#3a2418" text-anchor="end">₹450</text>
    <line x1="30" y1="172" x2="360" y2="172" stroke="#eaddc9"/>
    <text x="30" y="198" font-weight="700" fill="#3a2418">Butterscotch Pastry</text>
    <text x="30" y="216" font-size="11" fill="#8a7663">₹70 each</text>
    <rect x="232" y="190" width="78" height="28" rx="14" fill="#ffffff" stroke="#eaddc9"/>
    <text x="246" y="209" fill="#3a2418" text-anchor="middle">−</text><text x="271" y="209" fill="#3a2418" text-anchor="middle">2</text><text x="296" y="209" fill="#3a2418" text-anchor="middle">+</text>
    <text x="360" y="209" font-weight="700" fill="#3a2418" text-anchor="end">₹140</text>
    <line x1="30" y1="232" x2="360" y2="232" stroke="#eaddc9"/>
    <text x="30" y="276" font-size="15" font-weight="800" fill="#3a2418">Total</text>
    <text x="360" y="276" font-size="15" font-weight="800" fill="#3a2418" text-anchor="end">₹590</text>
  </g>

  <rect x="16" y="316" width="358" height="42" rx="21" fill="#ffffff" stroke="#b4741f" stroke-dasharray="5 4"/>
  <text x="195" y="342" font-size="13" font-weight="700" fill="#b4741f" text-anchor="middle">+ Add more items</text>

  <!-- Where are you? -->
  <text x="16" y="392" font-size="12" font-weight="700" fill="#8a7663" letter-spacing="1">WHERE ARE YOU?</text>
  <g font-size="12">
    <rect x="16" y="402" width="173" height="58" rx="12" fill="#ffffff" stroke="#eaddc9"/>
    <text x="28" y="426" font-weight="700" fill="#3a2418">I'm at a table</text><text x="28" y="444" font-size="11" fill="#8a7663">We'll bring it to you</text>
    <rect x="201" y="402" width="173" height="58" rx="12" fill="#ffffff" stroke="#eaddc9"/>
    <text x="213" y="426" font-weight="700" fill="#3a2418">I'm at the counter</text><text x="213" y="444" font-size="11" fill="#8a7663">We'll call your name</text>
    <rect x="16" y="470" width="173" height="58" rx="12" fill="#ffffff" stroke="#eaddc9"/>
    <text x="28" y="494" font-weight="700" fill="#3a2418">Pick up later</text><text x="28" y="512" font-size="11" fill="#8a7663">Collect it from the shop</text>
    <rect x="201" y="470" width="173" height="58" rx="12" fill="#fdf6ec" stroke="#b4741f" stroke-width="2"/>
    <text x="213" y="494" font-weight="700" fill="#3a2418">Delivery</text><text x="213" y="512" font-size="11" fill="#8a7663">To your address</text>
  </g>

  <!-- Fields (delivery selected) -->
  <g font-size="12">
    <text x="16" y="558" font-weight="700" fill="#8a7663">Your name</text>
    <rect x="16" y="566" width="358" height="42" rx="10" fill="#ffffff" stroke="#eaddc9"/><text x="28" y="592" fill="#b9a892">Ravi</text>

    <text x="16" y="632" font-weight="700" fill="#8a7663">Phone number</text>
    <rect x="16" y="640" width="358" height="42" rx="10" fill="#ffffff" stroke="#eaddc9"/><text x="28" y="666" fill="#b9a892">98765 43210</text>

    <text x="16" y="706" font-weight="700" fill="#8a7663">Delivery address</text>
    <rect x="16" y="714" width="358" height="64" rx="10" fill="#ffffff" stroke="#eaddc9"/><text x="28" y="740" fill="#b9a892">House no., street, landmark</text>

    <rect x="16" y="790" width="358" height="84" rx="12" fill="#fdf6ec" stroke="#eaddc9"/>
    <text x="28" y="812" font-weight="700" fill="#3a2418">Your location</text>
    <text x="28" y="830" font-size="11" fill="#8a7663">Needed so the delivery reaches the right door.</text>
    <rect x="28" y="838" width="160" height="28" rx="14" fill="#ffffff" stroke="#b4741f"/>
    <text x="108" y="857" font-weight="700" fill="#b4741f" text-anchor="middle">Share my location</text>

    <text x="16" y="900" font-weight="700" fill="#8a7663">When</text>
    <rect x="16" y="908" width="358" height="42" rx="10" fill="#ffffff" stroke="#eaddc9"/><text x="28" y="934" fill="#3a2418">As soon as possible</text>
    <text x="358" y="934" fill="#8a7663" text-anchor="end">▾</text>

    <text x="16" y="974" font-weight="700" fill="#8a7663">How will you pay?</text>
    <rect x="16" y="982" width="358" height="42" rx="10" fill="#ffffff" stroke="#eaddc9"/><text x="28" y="1008" fill="#3a2418">UPI (GPay / PhonePe / Paytm)</text>
    <text x="358" y="1008" fill="#8a7663" text-anchor="end">▾</text>

    <text x="16" y="1048" font-weight="700" fill="#8a7663">Note (optional)</text>
    <rect x="16" y="1056" width="358" height="56" rx="10" fill="#ffffff" stroke="#eaddc9"/><text x="28" y="1082" fill="#b9a892">Less sugar, a message on the cake…</text>
  </g>

  <rect x="16" y="1130" width="358" height="52" rx="26" fill="#15803d"/>
  <text x="195" y="1162" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Send order on WhatsApp</text>
  <text x="195" y="1204" font-size="11" fill="#8a7663" text-anchor="middle">Opens WhatsApp with your order typed in.</text>
</svg>
