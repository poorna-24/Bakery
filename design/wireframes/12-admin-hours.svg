<svg xmlns="http://www.w3.org/2000/svg" width="390" height="760" viewBox="0 0 390 760" font-family="Arial, Helvetica, sans-serif">
  <title>12 Admin · Shop hours</title>
  <rect width="390" height="760" fill="#f7f4ef"/>

  <g id="admin-header">
    <rect width="390" height="104" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="16" y="34" font-size="14" font-weight="800" fill="#b4741f" letter-spacing="1.5">BAKERY NAME ADMIN</text>
    <rect x="296" y="14" width="78" height="30" rx="8" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="335" y="34" font-size="12" fill="#2b1e14" text-anchor="middle">Sign out</text>
    <g font-size="12">
      <rect x="16" y="60" width="56" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="44" y="79" fill="#2b1e14" text-anchor="middle">Menu</text>
      <rect x="78" y="60" width="62" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="109" y="79" fill="#2b1e14" text-anchor="middle">Orders</text>
      <rect x="146" y="60" width="60" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="176" y="79" fill="#2b1e14" text-anchor="middle">Offers</text>
      <rect x="212" y="60" width="56" height="30" rx="15" fill="#b4741f"/><text x="240" y="79" fill="#ffffff" text-anchor="middle" font-weight="700">Hours</text>
      <rect x="274" y="60" width="72" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="310" y="79" fill="#2b1e14" text-anchor="middle">Ordering</text>
      <rect x="352" y="60" width="90" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="362" y="79" fill="#2b1e14">Appear…</text>
    </g>
  </g>

  <text x="16" y="134" font-size="12" fill="#b4741f">← All categories</text>
  <text x="16" y="168" font-size="26" font-weight="800" fill="#2b1e14">Shop hours</text>
  <text x="16" y="196" font-size="12" fill="#7a6a5b">Sets the "Open now" / "Closed" badge on the menu.</text>

  <rect x="16" y="210" width="358" height="34" rx="17" fill="#ffffff" stroke="#e5dcd0"/>
  <circle cx="34" cy="227" r="5" fill="#15803d"/>
  <text x="46" y="231" font-size="12" fill="#2b1e14"><tspan font-weight="700">Open now</tspan> · 7:00 am – 9:00 pm · as customers see it</text>

  <rect x="16" y="260" width="358" height="270" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
  <g font-size="11" font-weight="700" fill="#7a6a5b" letter-spacing="1">
    <text x="32" y="288">OPENS AT</text>
    <text x="204" y="288">CLOSES AT</text>
    <text x="32" y="372">WEEKLY OFF</text>
  </g>
  <rect x="32" y="296" width="156" height="42" rx="10" fill="#ffffff" stroke="#e5dcd0"/><text x="44" y="322" font-size="13" fill="#2b1e14">07:00 AM</text>
  <rect x="204" y="296" width="154" height="42" rx="10" fill="#ffffff" stroke="#e5dcd0"/><text x="216" y="322" font-size="13" fill="#2b1e14">09:00 PM</text>
  <text x="32" y="392" font-size="11" fill="#7a6a5b">Tick any day the shop stays shut. Leave all unticked</text>
  <text x="32" y="408" font-size="11" fill="#7a6a5b">if you open every day.</text>
  <g font-size="12">
    <rect x="32" y="424" width="70" height="34" rx="17" fill="#b4741f"/><text x="67" y="446" fill="#ffffff" text-anchor="middle" font-weight="700">✓ Sun</text>
    <rect x="110" y="424" width="56" height="34" rx="17" fill="#ffffff" stroke="#e5dcd0"/><text x="138" y="446" fill="#2b1e14" text-anchor="middle">Mon</text>
    <rect x="174" y="424" width="56" height="34" rx="17" fill="#ffffff" stroke="#e5dcd0"/><text x="202" y="446" fill="#2b1e14" text-anchor="middle">Tue</text>
    <rect x="238" y="424" width="56" height="34" rx="17" fill="#ffffff" stroke="#e5dcd0"/><text x="266" y="446" fill="#2b1e14" text-anchor="middle">Wed</text>
    <rect x="302" y="424" width="56" height="34" rx="17" fill="#ffffff" stroke="#e5dcd0"/><text x="330" y="446" fill="#2b1e14" text-anchor="middle">Thu</text>
    <rect x="32" y="466" width="56" height="34" rx="17" fill="#ffffff" stroke="#e5dcd0"/><text x="60" y="488" fill="#2b1e14" text-anchor="middle">Fri</text>
    <rect x="96" y="466" width="56" height="34" rx="17" fill="#ffffff" stroke="#e5dcd0"/><text x="124" y="488" fill="#2b1e14" text-anchor="middle">Sat</text>
  </g>

  <g font-size="13">
    <rect x="16" y="550" width="116" height="42" rx="10" fill="#b4741f"/><text x="74" y="576" fill="#ffffff" font-weight="700" text-anchor="middle">Save hours</text>
    <rect x="140" y="550" width="130" height="42" rx="10" fill="#ffffff" stroke="#e5dcd0"/><text x="205" y="576" fill="#2b1e14" text-anchor="middle">Hide the badge</text>
    <rect x="16" y="602" width="160" height="42" rx="10" fill="#ffffff" stroke="#e5dcd0"/><text x="96" y="628" fill="#2b1e14" text-anchor="middle">Preview on a phone</text>
  </g>
  <text x="16" y="680" font-size="11" fill="#7a6a5b">Times are India time. Closing after midnight works too.</text>
</svg>
