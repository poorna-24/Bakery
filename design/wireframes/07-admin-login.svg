<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" font-family="Arial, Helvetica, sans-serif">
  <title>07 Admin · Sign in</title>
  <rect width="390" height="700" fill="#f7f4ef"/>
  <rect x="24" y="140" width="342" height="420" rx="20" fill="#ffffff" stroke="#e5dcd0"/>
  <text x="195" y="190" font-size="22" font-weight="800" fill="#2b1e14" text-anchor="middle">Bakery Name Admin</text>
  <text x="195" y="214" font-size="13" fill="#7a6a5b" text-anchor="middle">Sign in to manage the menu.</text>

  <rect x="48" y="232" width="294" height="40" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="195" y="257" font-size="12" fill="#b91c1c" text-anchor="middle">Wrong email or password.</text>

  <g font-size="11" font-weight="700" fill="#7a6a5b" letter-spacing="1">
    <text x="48" y="298">EMAIL</text>
    <text x="48" y="370">PASSWORD</text>
  </g>
  <rect x="48" y="306" width="294" height="42" rx="10" fill="#ffffff" stroke="#e5dcd0"/>
  <text x="60" y="332" font-size="13" fill="#2b1e14">owner@bakery.com</text>
  <rect x="48" y="378" width="294" height="42" rx="10" fill="#ffffff" stroke="#e5dcd0"/>
  <text x="60" y="404" font-size="13" fill="#2b1e14">••••••••••</text>

  <rect x="48" y="438" width="18" height="18" rx="4" fill="#b4741f"/>
  <text x="57" y="452" font-size="12" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="76" y="452" font-size="12" fill="#2b1e14">Keep me signed in on this phone for 30 days</text>

  <rect x="48" y="478" width="294" height="46" rx="12" fill="#b4741f"/>
  <text x="195" y="506" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Sign in</text>
</svg>
