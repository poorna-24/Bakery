<svg xmlns="http://www.w3.org/2000/svg" width="390" height="980" viewBox="0 0 390 980" font-family="Arial, Helvetica, sans-serif">
  <title>16 Admin · QR code for table cards</title>
  <rect width="390" height="980" fill="#f7f4ef"/>

  <g id="admin-header">
    <rect width="390" height="104" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="16" y="34" font-size="14" font-weight="800" fill="#b4741f" letter-spacing="1.5">BAKERY NAME ADMIN</text>
    <rect x="296" y="14" width="78" height="30" rx="8" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="335" y="34" font-size="12" fill="#2b1e14" text-anchor="middle">Sign out</text>
    <g font-size="12">
      <rect x="-30" y="60" width="72" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="6" y="79" fill="#2b1e14" text-anchor="middle">Ordering</text>
      <rect x="48" y="60" width="96" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="96" y="79" fill="#2b1e14" text-anchor="middle">Appearance</text>
      <rect x="150" y="60" width="74" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="187" y="79" fill="#2b1e14" text-anchor="middle">Preview</text>
      <rect x="230" y="60" width="84" height="30" rx="15" fill="#b4741f"/><text x="272" y="79" fill="#ffffff" text-anchor="middle" font-weight="700">QR code</text>
    </g>
  </g>

  <text x="16" y="134" font-size="12" fill="#b4741f">← All categories</text>
  <text x="16" y="168" font-size="26" font-weight="800" fill="#2b1e14">QR code</text>

  <!-- QR card (left column on desktop) -->
  <rect x="55" y="188" width="280" height="370" rx="20" fill="#ffffff" stroke="#e5dcd0"/>
  <text x="195" y="226" font-size="16" font-weight="900" fill="#2b1e14" text-anchor="middle" letter-spacing="2">BAKERY NAME</text>
  <line x1="150" y1="242" x2="185" y2="242" stroke="#b4741f"/>
  <rect x="190" y="237" width="10" height="10" fill="#b4741f" transform="rotate(45 195 242)"/>
  <line x1="205" y1="242" x2="240" y2="242" stroke="#b4741f"/>
  <rect x="105" y="260" width="180" height="180" fill="#ffffff" stroke="#2b1e14"/>
  <g fill="#2b1e14">
    <rect x="117" y="272" width="42" height="42"/><rect x="231" y="272" width="42" height="42"/><rect x="117" y="386" width="42" height="42"/>
    <rect x="171" y="284" width="14" height="14"/><rect x="195" y="308" width="14" height="14"/><rect x="171" y="332" width="20" height="20"/>
    <rect x="215" y="348" width="14" height="14"/><rect x="245" y="380" width="24" height="24"/><rect x="181" y="392" width="14" height="14"/>
    <rect x="129" y="338" width="14" height="14"/><rect x="221" y="410" width="14" height="14"/>
  </g>
  <text x="195" y="476" font-size="15" font-weight="700" fill="#2b1e14" text-anchor="middle">Scan for our menu</text>
  <text x="195" y="498" font-size="11" fill="#7a6a5b" text-anchor="middle">Customers can scan it straight off this screen.</text>

  <!-- Details (right column on desktop) -->
  <text x="16" y="594" font-size="11" font-weight="700" fill="#7a6a5b" letter-spacing="1">THE CODE OPENS</text>
  <text x="16" y="616" font-size="13" fill="#b4741f" text-decoration="underline">https://[your-domain]/</text>
  <g font-size="13">
    <rect x="16" y="634" width="150" height="42" rx="10" fill="#b4741f"/><text x="91" y="660" fill="#ffffff" font-weight="700" text-anchor="middle">Download PNG</text>
    <rect x="174" y="634" width="140" height="42" rx="10" fill="#ffffff" stroke="#e5dcd0"/><text x="244" y="660" fill="#2b1e14" text-anchor="middle">Download SVG</text>
    <rect x="16" y="686" width="220" height="42" rx="10" fill="#ffffff" stroke="#e5dcd0"/><text x="126" y="712" fill="#2b1e14" text-anchor="middle">Full screen &amp; print card</text>
  </g>
  <g font-size="12" fill="#7a6a5b">
    <text x="16" y="764">• Lost or damaged a table card? Print a new one</text>
    <text x="26" y="780">from here; the code never changes.</text>
    <text x="16" y="806">• Showing a customer? Use Full screen.</text>
    <text x="16" y="832">• PNG for phones and printing shops; SVG for</text>
    <text x="26" y="848">big posters (stays sharp at any size).</text>
    <text x="16" y="874">• The code only holds the address, so menu</text>
    <text x="26" y="890">changes never need a new code.</text>
  </g>
</svg>
