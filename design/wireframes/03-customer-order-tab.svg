<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Arial, Helvetica, sans-serif">
  <title>03 Customer · Order on WhatsApp tab</title>
  <rect width="390" height="844" fill="#fdf6ec"/>

  <!-- Compact sticky header after scrolling -->
  <rect width="390" height="56" fill="#fdf6ec" stroke="#eaddc9"/>
  <text x="195" y="34" font-size="13" font-weight="800" fill="#b4741f" text-anchor="middle" letter-spacing="2">BAKERY NAME</text>
  <circle cx="356" cy="28" r="17" fill="#ffffff" stroke="#eaddc9"/>
  <circle cx="353" cy="25" r="6" fill="none" stroke="#3a2418" stroke-width="2"/>
  <line x1="357" y1="29" x2="362" y2="34" stroke="#3a2418" stroke-width="2"/>

  <!-- Tabs: Order active -->
  <rect x="45" y="72" width="300" height="42" rx="21" fill="#ffffff" stroke="#eaddc9"/>
  <text x="109" y="98" font-size="13" font-weight="700" fill="#3a2418" text-anchor="middle">Menu</text>
  <rect x="173" y="76" width="168" height="34" rx="17" fill="#b4741f"/>
  <circle cx="190" cy="93" r="7" fill="#ffffff"/>
  <text x="265" y="98" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Order on WhatsApp</text>
  <circle cx="338" cy="76" r="10" fill="#3a2418" stroke="#ffffff" stroke-width="2"/>
  <text x="338" y="80" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <!-- Chips -->
  <g font-size="12">
    <rect x="16" y="130" width="70" height="30" rx="15" fill="#b4741f"/><text x="51" y="149" fill="#ffffff" text-anchor="middle" font-weight="700">Cakes</text>
    <rect x="94" y="130" width="80" height="30" rx="15" fill="#ffffff" stroke="#eaddc9"/><text x="134" y="149" fill="#3a2418" text-anchor="middle">Pastries</text>
    <rect x="182" y="130" width="74" height="30" rx="15" fill="#ffffff" stroke="#eaddc9"/><text x="219" y="149" fill="#3a2418" text-anchor="middle">Breads</text>
    <rect x="264" y="130" width="76" height="30" rx="15" fill="#ffffff" stroke="#eaddc9"/><text x="302" y="149" fill="#3a2418" text-anchor="middle">Snacks</text>
  </g>

  <rect x="16" y="178" width="4" height="22" fill="#b4741f"/>
  <text x="28" y="195" font-size="19" font-weight="800" fill="#3a2418">Cakes</text>

  <!-- Row 1: sizes + stepper -->
  <g id="row-stepper">
    <rect x="16" y="214" width="358" height="112" rx="14" fill="#ffffff" stroke="#eaddc9"/>
    <rect x="28" y="226" width="64" height="64" rx="10" fill="#eee5d8"/>
    <rect x="104" y="230" width="10" height="10" fill="none" stroke="#15803d" stroke-width="1.5"/><circle cx="109" cy="235" r="2.5" fill="#15803d"/>
    <text x="120" y="240" font-size="14" font-weight="700" fill="#3a2418">Choco Truffle Cake</text>
    <rect x="104" y="252" width="56" height="24" rx="12" fill="#b4741f"/><text x="132" y="268" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">500 g</text>
    <rect x="166" y="252" width="48" height="24" rx="12" fill="#ffffff" stroke="#eaddc9"/><text x="190" y="268" font-size="11" fill="#3a2418" text-anchor="middle">1 kg</text>
    <text x="104" y="306" font-size="14" font-weight="700" fill="#b4741f">₹450</text>
    <rect x="258" y="284" width="104" height="34" rx="17" fill="#b4741f"/>
    <text x="276" y="306" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">−</text>
    <text x="310" y="306" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="344" y="306" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
  </g>

  <!-- Row 2: Add button -->
  <g id="row-add">
    <rect x="16" y="338" width="358" height="88" rx="14" fill="#ffffff" stroke="#eaddc9"/>
    <rect x="28" y="350" width="64" height="64" rx="10" fill="#eee5d8"/>
    <rect x="104" y="356" width="10" height="10" fill="none" stroke="#15803d" stroke-width="1.5"/><circle cx="109" cy="361" r="2.5" fill="#15803d"/>
    <text x="120" y="366" font-size="14" font-weight="700" fill="#3a2418">Black Forest Pastry</text>
    <text x="104" y="384" font-size="12" fill="#8a7663">per piece</text>
    <text x="104" y="408" font-size="14" font-weight="700" fill="#b4741f">₹80</text>
    <rect x="282" y="378" width="80" height="34" rx="17" fill="#ffffff" stroke="#b4741f" stroke-width="1.5"/>
    <text x="322" y="400" font-size="13" font-weight="700" fill="#b4741f" text-anchor="middle">Add</text>
  </g>

  <!-- Row 3: stepper qty 2 -->
  <g id="row-stepper-2">
    <rect x="16" y="438" width="358" height="88" rx="14" fill="#ffffff" stroke="#eaddc9"/>
    <rect x="28" y="450" width="64" height="64" rx="10" fill="#eee5d8"/>
    <rect x="104" y="456" width="10" height="10" fill="none" stroke="#15803d" stroke-width="1.5"/><circle cx="109" cy="461" r="2.5" fill="#15803d"/>
    <text x="120" y="466" font-size="14" font-weight="700" fill="#3a2418">Butterscotch Pastry</text>
    <text x="104" y="484" font-size="12" fill="#8a7663">per piece</text>
    <text x="104" y="508" font-size="14" font-weight="700" fill="#b4741f">₹70</text>
    <rect x="258" y="478" width="104" height="34" rx="17" fill="#b4741f"/>
    <text x="276" y="500" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">−</text>
    <text x="310" y="500" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="344" y="500" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
  </g>

  <!-- Row 4: sold out -->
  <g id="row-sold-out">
    <rect x="16" y="538" width="358" height="88" rx="14" fill="#ffffff" stroke="#eaddc9"/>
    <rect x="28" y="550" width="64" height="64" rx="10" fill="#6b5f55"/>
    <rect x="104" y="556" width="10" height="10" fill="none" stroke="#b91c1c" stroke-width="1.5"/><circle cx="109" cy="561" r="2.5" fill="#b91c1c"/>
    <text x="120" y="566" font-size="14" font-weight="700" fill="#8a7663">Red Velvet Cake</text>
    <text x="104" y="608" font-size="14" font-weight="700" fill="#8a7663">₹500</text>
    <text x="362" y="600" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="end">Sold out</text>
  </g>

  <!-- Strong cart bar (Order tab) -->
  <rect x="16" y="770" width="358" height="56" rx="16" fill="#3a2418"/>
  <text x="36" y="804" font-size="14" font-weight="700" fill="#fdf6ec">3 items · ₹590</text>
  <text x="354" y="804" font-size="14" font-weight="700" fill="#fdf6ec" text-anchor="end">Review order →</text>
</svg>
