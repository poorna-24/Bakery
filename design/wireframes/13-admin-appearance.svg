    <text x="335" y="34" font-size="12" fill="#2b1e14" text-anchor="middle">Sign out</text>
    <g font-size="12">
      <rect x="-40" y="60" width="62" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="-9" y="79" fill="#2b1e14" text-anchor="middle">Orders</text>
      <rect x="28" y="60" width="60" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="58" y="79" fill="#2b1e14" text-anchor="middle">Offers</text>
      <rect x="94" y="60" width="56" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="122" y="79" fill="#2b1e14" text-anchor="middle">Hours</text>
      <rect x="156" y="60" width="72" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="192" y="79" fill="#2b1e14" text-anchor="middle">Ordering</text>
      <rect x="234" y="60" width="96" height="30" rx="15" fill="#b4741f"/><text x="282" y="79" fill="#ffffff" text-anchor="middle" font-weight="700">Appearance</text>
      <rect x="336" y="60" width="74" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="346" y="79" fill="#2b1e14">Previ…</text>
    </g>
  </g>

  <text x="16" y="134" font-size="12" fill="#b4741f">← All categories</text>
  <text x="16" y="168" font-size="26" font-weight="800" fill="#2b1e14">Appearance</text>
  <text x="16" y="194" font-size="12" fill="#7a6a5b">The background behind the menu. Pick Plain to turn it off.</text>

  <!-- Swatch cards (1 col phone, 2 on tablet, 3 on desktop; 2 shown to save space) -->
  <g font-size="12">
    <rect x="16" y="210" width="173" height="170" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
    <rect x="24" y="218" width="157" height="100" rx="10" fill="#fdf6ec"/>
    <text x="28" y="344" font-weight="700" fill="#2b1e14">Plain</text><text x="28" y="362" font-size="10" fill="#7a6a5b">Just the cream colour</text>

    <rect x="201" y="210" width="173" height="170" rx="14" fill="#ffffff" stroke="#b4741f" stroke-width="2"/>
    <rect x="209" y="218" width="157" height="100" rx="10" fill="#f3e3ce"/>
    <g fill="#e0c9a6"><circle cx="229" cy="238" r="5"/><circle cx="259" cy="258" r="5"/><circle cx="289" cy="238" r="5"/><circle cx="319" cy="258" r="5"/><circle cx="349" cy="238" r="5"/><circle cx="229" cy="278" r="5"/><circle cx="289" cy="278" r="5"/><circle cx="349" cy="278" r="5"/><circle cx="259" cy="298" r="5"/><circle cx="319" cy="298" r="5"/></g>
    <rect x="306" y="224" width="54" height="18" rx="9" fill="#b4741f"/><text x="333" y="237" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Selected</text>
    <text x="213" y="344" font-weight="700" fill="#2b1e14">Polka dots</text><text x="213" y="362" font-size="10" fill="#7a6a5b">Soft dots, playful</text>

    <rect x="16" y="392" width="173" height="170" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
    <rect x="24" y="400" width="157" height="100" rx="10" fill="#f6ead8"/>
    <path d="M24 440 q20 -16 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#e0c9a6" stroke-width="3"/>
    <path d="M24 470 q20 -16 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#e0c9a6" stroke-width="3"/>
    <text x="28" y="526" font-weight="700" fill="#2b1e14">Piped icing</text><text x="28" y="544" font-size="10" fill="#7a6a5b">Wavy cream lines</text>

    <rect x="201" y="392" width="173" height="170" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
    <rect x="209" y="400" width="157" height="100" rx="10" fill="#f1e6d6"/>
    <text x="213" y="526" font-weight="700" fill="#2b1e14">Linen weave</text><text x="213" y="544" font-size="10" fill="#7a6a5b">Fine cloth texture</text>

    <rect x="16" y="574" width="173" height="170" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
    <rect x="24" y="582" width="157" height="100" rx="10" fill="#fbe3c4"/>
    <text x="28" y="708" font-weight="700" fill="#2b1e14">Morning glow</text><text x="28" y="726" font-size="10" fill="#7a6a5b">Warm sunrise wash</text>

    <rect x="201" y="574" width="173" height="170" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
    <rect x="209" y="582" width="157" height="100" rx="10" fill="#eee5d8"/>
    <text x="287" y="636" font-size="11" fill="#7a6a5b" text-anchor="middle">No photo yet</text>
    <text x="213" y="708" font-weight="700" fill="#2b1e14">Your own photo</text><text x="213" y="726" font-size="10" fill="#7a6a5b">Upload below</text>
  </g>

  <rect x="16" y="760" width="358" height="112" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
  <text x="32" y="788" font-size="11" font-weight="700" fill="#7a6a5b" letter-spacing="1">UPLOAD YOUR OWN PHOTO</text>
  <rect x="32" y="800" width="110" height="34" rx="8" fill="#b4741f"/><text x="87" y="822" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Choose file</text>
  <text x="152" y="822" font-size="12" fill="#7a6a5b">No file chosen</text>
  <text x="32" y="856" font-size="10" fill="#7a6a5b">Up to 5 MB. Selects "Your own photo" automatically.</text>

  <g font-size="13">
    <rect x="16" y="890" width="150" height="42" rx="10" fill="#b4741f"/><text x="91" y="916" fill="#ffffff" font-weight="700" text-anchor="middle">Save background</text>
