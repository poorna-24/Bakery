<svg xmlns="http://www.w3.org/2000/svg" width="390" height="820" viewBox="0 0 390 820" font-family="Arial, Helvetica, sans-serif">
  <title>09 Admin · Category items</title>
  <rect width="390" height="820" fill="#f7f4ef"/>

  <g id="admin-header">
    <rect width="390" height="104" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="16" y="34" font-size="14" font-weight="800" fill="#b4741f" letter-spacing="1.5">BAKERY NAME ADMIN</text>
    <rect x="296" y="14" width="78" height="30" rx="8" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="335" y="34" font-size="12" fill="#2b1e14" text-anchor="middle">Sign out</text>
    <g font-size="12">
      <rect x="16" y="60" width="56" height="30" rx="15" fill="#b4741f"/><text x="44" y="79" fill="#ffffff" text-anchor="middle" font-weight="700">Menu</text>
      <rect x="78" y="60" width="62" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="109" y="79" fill="#2b1e14" text-anchor="middle">Orders</text>
      <rect x="146" y="60" width="60" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="176" y="79" fill="#2b1e14" text-anchor="middle">Offers</text>
      <rect x="212" y="60" width="56" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="240" y="79" fill="#2b1e14" text-anchor="middle">Hours</text>
      <rect x="274" y="60" width="72" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="310" y="79" fill="#2b1e14" text-anchor="middle">Ordering</text>
      <rect x="352" y="60" width="90" height="30" rx="15" fill="#ffffff" stroke="#e5dcd0"/><text x="362" y="79" fill="#2b1e14">Appear…</text>
    </g>
  </g>

  <text x="16" y="134" font-size="12" fill="#b4741f">← All categories</text>
  <text x="16" y="168" font-size="26" font-weight="800" fill="#2b1e14">Cakes</text>
  <rect x="264" y="144" width="110" height="38" rx="10" fill="#b4741f"/>
  <text x="319" y="168" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">+ Add item</text>

  <!-- Item row: available -->
  <g id="item-row-1">
    <rect x="16" y="198" width="358" height="118" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="30" y="226" font-size="11" fill="#7a6a5b">▲</text><text x="30" y="246" font-size="11" fill="#7a6a5b">▼</text>
    <rect x="48" y="212" width="56" height="56" rx="10" fill="#eee5d8"/>
    <text x="116" y="232" font-size="14" font-weight="700" fill="#2b1e14">Choco Truffle Cake <tspan fill="#d97706">★</tspan></text>
    <text x="116" y="252" font-size="12" fill="#7a6a5b">₹450 – ₹850 · Eggless</text>
    <g font-size="12">
      <rect x="116" y="276" width="86" height="28" rx="8" fill="#dcfce7"/><text x="159" y="294" fill="#15803d" text-anchor="middle" font-weight="700">Available</text>
      <rect x="208" y="276" width="60" height="28" rx="8" fill="#ffffff" stroke="#e5dcd0"/><text x="238" y="294" fill="#2b1e14" text-anchor="middle">Edit</text>
      <rect x="274" y="276" width="88" height="28" rx="8" fill="#ffffff" stroke="#fecaca"/><text x="318" y="294" fill="#b91c1c" text-anchor="middle">Delete</text>
    </g>
  </g>
  <!-- Item row: sold out -->
  <g id="item-row-2">
    <rect x="16" y="326" width="358" height="118" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="30" y="354" font-size="11" fill="#7a6a5b">▲</text><text x="30" y="374" font-size="11" fill="#7a6a5b">▼</text>
    <rect x="48" y="340" width="56" height="56" rx="10" fill="#eee5d8"/>
    <text x="116" y="360" font-size="14" font-weight="700" fill="#2b1e14">Red Velvet Cake</text>
    <text x="116" y="380" font-size="12" fill="#7a6a5b">₹500 – ₹950 · Non-veg</text>
    <g font-size="12">
      <rect x="116" y="404" width="86" height="28" rx="8" fill="#fee2e2"/><text x="159" y="422" fill="#b91c1c" text-anchor="middle" font-weight="700">Sold out</text>
      <rect x="208" y="404" width="60" height="28" rx="8" fill="#ffffff" stroke="#e5dcd0"/><text x="238" y="422" fill="#2b1e14" text-anchor="middle">Edit</text>
      <rect x="274" y="404" width="88" height="28" rx="8" fill="#ffffff" stroke="#fecaca"/><text x="318" y="422" fill="#b91c1c" text-anchor="middle">Delete</text>
    </g>
  </g>
  <!-- Item row: delete confirm -->
  <g id="item-row-3">
    <rect x="16" y="454" width="358" height="118" rx="14" fill="#ffffff" stroke="#e5dcd0"/>
    <text x="30" y="482" font-size="11" fill="#7a6a5b">▲</text><text x="30" y="502" font-size="11" fill="#7a6a5b">▼</text>
    <rect x="48" y="468" width="56" height="56" rx="10" fill="#eee5d8"/>
    <text x="116" y="488" font-size="14" font-weight="700" fill="#2b1e14">Pineapple Cake</text>
    <text x="116" y="508" font-size="12" fill="#7a6a5b">₹380 per piece</text>
    <g font-size="12">
      <rect x="116" y="532" width="86" height="28" rx="8" fill="#dcfce7"/><text x="159" y="550" fill="#15803d" text-anchor="middle" font-weight="700">Available</text>
      <rect x="208" y="532" width="60" height="28" rx="8" fill="#ffffff" stroke="#e5dcd0"/><text x="238" y="550" fill="#2b1e14" text-anchor="middle">Edit</text>
      <rect x="274" y="532" width="54" height="28" rx="8" fill="#b91c1c"/><text x="301" y="550" fill="#ffffff" text-anchor="middle">Confirm</text>
      <rect x="332" y="532" width="34" height="28" rx="8" fill="#ffffff" stroke="#e5dcd0"/><text x="349" y="550" fill="#2b1e14" text-anchor="middle">No</text>
    </g>
  </g>

  <!-- Empty state example -->
  <rect x="16" y="600" width="358" height="150" rx="14" fill="#ffffff" stroke="#e5dcd0" stroke-dasharray="5 4"/>
  <text x="195" y="636" font-size="12" font-weight="700" fill="#7a6a5b" text-anchor="middle">EMPTY STATE (a category with no items)</text>
  <text x="195" y="662" font-size="14" font-weight="700" fill="#2b1e14" text-anchor="middle">No items in this category yet.</text>
  <text x="195" y="684" font-size="12" fill="#7a6a5b" text-anchor="middle">Until you add one, customers will not see it.</text>
  <rect x="115" y="700" width="160" height="36" rx="10" fill="#b4741f"/>
  <text x="195" y="723" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Add the first item</text>
</svg>
