<svg xmlns="http://www.w3.org/2000/svg" width="390" height="560" viewBox="0 0 390 560" font-family="Arial, Helvetica, sans-serif">
  <title>06 Customer · Footer, contact and install app</title>
  <rect width="390" height="560" fill="#fdf6ec"/>

  <rect x="16" y="24" width="358" height="420" rx="20" fill="#ffffff" stroke="#eaddc9"/>
  <text x="195" y="64" font-size="16" font-weight="800" fill="#b4741f" text-anchor="middle" letter-spacing="2">BAKERY NAME</text>
  <text x="195" y="86" font-size="12" fill="#8a7663" text-anchor="middle">Cherial, Telangana</text>
  <rect x="95" y="100" width="200" height="26" rx="13" fill="#dcfce7"/>
  <text x="195" y="117" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">• Open now · 7:00 am – 9:00 pm</text>

  <!-- Contact tiles -->
  <g font-size="12" font-weight="700">
    <rect x="32" y="146" width="100" height="78" rx="14" fill="#b4741f"/>
    <circle cx="82" cy="174" r="11" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="82" y="210" fill="#ffffff" text-anchor="middle">Directions</text>
    <rect x="145" y="146" width="100" height="78" rx="14" fill="#25D366"/>
    <circle cx="195" cy="174" r="11" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="195" y="210" fill="#ffffff" text-anchor="middle">WhatsApp</text>
    <rect x="258" y="146" width="100" height="78" rx="14" fill="#ffffff" stroke="#b4741f" stroke-width="1.5"/>
    <circle cx="308" cy="174" r="11" fill="none" stroke="#b4741f" stroke-width="2"/>
    <text x="308" y="210" fill="#b4741f" text-anchor="middle">Call</text>
  </g>

  <!-- Install app -->
  <rect x="32" y="242" width="326" height="46" rx="14" fill="#fdf6ec" stroke="#b4741f" stroke-dasharray="5 4"/>
  <text x="195" y="270" font-size="13" font-weight="700" fill="#b4741f" text-anchor="middle">Install the Bakery Name app</text>
  <text x="44" y="314" font-size="11" font-weight="700" fill="#3a2418">If the phone can't install in one tap:</text>
  <text x="44" y="336" font-size="11" fill="#8a7663">1. In Chrome, tap ⋮ at the top right.</text>
  <text x="44" y="356" font-size="11" fill="#8a7663">2. Choose Install app (or Add to Home screen),</text>
  <text x="56" y="372" font-size="11" fill="#8a7663">then Install.</text>
  <text x="44" y="400" font-size="11" fill="#8a7663">iPhone: Safari → Share → Add to Home Screen.</text>

  <text x="195" y="480" font-size="11" fill="#8a7663" text-anchor="middle">Prices are inclusive of taxes and may change without notice.</text>
  <text x="195" y="504" font-size="11" fill="#b4741f" text-anchor="middle" text-decoration="underline">Page created by [YOUR NAME]</text>
</svg>
