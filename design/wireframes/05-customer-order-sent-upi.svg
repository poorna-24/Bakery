<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" font-family="Arial, Helvetica, sans-serif">
  <title>05 Customer · Order placed, pay by UPI</title>
  <rect width="390" height="900" fill="#3a2418" opacity="0.55"/>
  <rect x="0" y="40" width="390" height="880" rx="24" fill="#ffffff"/>
  <rect x="175" y="52" width="40" height="5" rx="2.5" fill="#eaddc9"/>

  <circle cx="195" cy="112" r="30" fill="#25D366"/>
  <text x="195" y="120" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="195" y="174" font-size="22" font-weight="800" fill="#3a2418" text-anchor="middle">Order #B7K2</text>

  <!-- Step 1 -->
  <rect x="16" y="196" width="358" height="420" rx="16" fill="#fdf6ec" stroke="#eaddc9"/>
  <text x="32" y="226" font-size="13" font-weight="800" fill="#b4741f">STEP 1 · PAY ₹590 BY UPI</text>
  <rect x="32" y="240" width="326" height="48" rx="24" fill="#b4741f"/>
  <text x="195" y="269" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Pay ₹590 with a UPI app</text>
  <text x="195" y="308" font-size="11" fill="#8a7663" text-anchor="middle">Opens GPay, PhonePe or Paytm · UPI ID bakery@okaxis</text>
  <rect x="115" y="324" width="160" height="160" rx="8" fill="#ffffff" stroke="#3a2418"/>
  <g fill="#3a2418">
    <rect x="127" y="336" width="36" height="36"/><rect x="227" y="336" width="36" height="36"/><rect x="127" y="436" width="36" height="36"/>
    <rect x="175" y="348" width="12" height="12"/><rect x="195" y="372" width="12" height="12"/><rect x="179" y="400" width="16" height="16"/>
    <rect x="215" y="412" width="12" height="12"/><rect x="239" y="440" width="20" height="20"/><rect x="183" y="448" width="12" height="12"/>
  </g>
  <text x="195" y="508" font-size="11" fill="#8a7663" text-anchor="middle">Or scan this from another phone — or save it</text>
  <text x="195" y="524" font-size="11" fill="#8a7663" text-anchor="middle">and pick it in your UPI app.</text>

  <!-- Step 2 -->
  <rect x="16" y="632" width="358" height="122" rx="16" fill="#fdf6ec" stroke="#eaddc9"/>
  <text x="32" y="662" font-size="13" font-weight="800" fill="#15803d">STEP 2 · SEND YOUR ORDER</text>
  <rect x="32" y="680" width="326" height="48" rx="24" fill="#15803d"/>
  <text x="195" y="709" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Send order on WhatsApp</text>

  <text x="195" y="782" font-size="11" fill="#8a7663" text-anchor="middle">Phones stack the steps; wider screens show them side by side.</text>

  <rect x="16" y="806" width="358" height="46" rx="23" fill="#ffffff" stroke="#eaddc9"/>
  <text x="195" y="834" font-size="14" fill="#3a2418" text-anchor="middle">Done — start a new order</text>
</svg>
