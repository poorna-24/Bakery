# The whole thing: one Postgres and one app serving both the menu and the
# dashboard.
#
#   cp .env.example .env      # then fill it in
#   npm run docker:setup      # create the tables
#   npm run docker            # start
#
# Menu       http://localhost:3000
# Dashboard  http://localhost:3000/admin

name: bakery

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bakery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bakery
    volumes:
      - db-data:/var/lib/postgresql/data
    # Published so Prisma Studio and psql can reach it from the host. Drop this
    # line if you would rather the database stayed inside the compose network.
    ports:
      - "5432:5432"
    healthcheck:
      # The app starts the moment this passes, so it has to mean "ready for
      # queries", not merely "the process is up".
      test: ["CMD-SHELL", "pg_isready -U bakery -d bakery"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: creates the tables from prisma/schema.prisma. Run it once before
  # the first start, and again after any schema change. Built from the `builder`
  # stage because that is the only one carrying the Prisma CLI and the schema —
  # the runtime image is deliberately too slim to do this.
  migrate:
    profiles: ["setup"]
    build:
      context: .
      target: builder
      secrets:
        - extra_ca_certs
    environment:
      DATABASE_URL: &db-url postgresql://bakery:${POSTGRES_PASSWORD}@db:5432/bakery
      DIRECT_URL: *db-url
    command: npx prisma db push --skip-generate
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      secrets:
        - extra_ca_certs
    restart: unless-stopped
    environment:
      # No pooler in front of a local Postgres, so both point at the same place.
      # In production DATABASE_URL is Supabase's pooler on 6543 and DIRECT_URL
      # is the direct line on 5432.
      DATABASE_URL: *db-url
      DIRECT_URL: *db-url

      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      # Plain password for local use. In production set ADMIN_PASSWORD_HASH
      # instead and leave this empty.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      # Leave empty and photos are written to the volume below instead.
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}

      # Read on the server and passed down as props, so these are ordinary
      # runtime values: correct a phone number here and a restart is enough —
      # no rebuild, because nothing is baked into the image.
      SHOP_NAME: ${SHOP_NAME:-Our Bakery}
      SHOP_TAGLINE: ${SHOP_TAGLINE:-}
      SHOP_ADDRESS: ${SHOP_ADDRESS:-}
      SHOP_MAP_URL: ${SHOP_MAP_URL:-}
      SHOP_PHONE: ${SHOP_PHONE:-}
      SHOP_WHATSAPP: ${SHOP_WHATSAPP:-}
      CREDIT_NAME: ${CREDIT_NAME:-}
      CREDIT_WHATSAPP: ${CREDIT_WHATSAPP:-}
    volumes:
      # Uploaded photos, kept outside the container so a rebuild does not lose
      # them. With CLOUDINARY_URL set this goes unused.
      - uploads:/data
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # This endpoint runs a real query, so it fails when the database is gone
      # rather than only when the process has died.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
  uploads:

secrets:
  # Only needed on a network that re-signs TLS with its own root certificate,
  # where `prisma generate` cannot verify binaries.prisma.sh. Point
  # EXTRA_CA_CERTS_FILE at that root in .env; everywhere else the placeholder
  # below is used, contains no certificate, and the build ignores it.
  extra_ca_certs:
    file: ${EXTRA_CA_CERTS_FILE:-./docker/no-extra-ca.pem}
