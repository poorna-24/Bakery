# Development overlay: hot reload instead of a production build.
#
#   npm run dev        start it
#   npm run dev:logs   watch the output
#
# The plain `npm start` stack compiles both apps ahead of time, which is what
# you want for checking the real thing — but it means every edit needs a
# rebuild. This overlay swaps that for `next dev` against your working copy, so
# a saved file refreshes the browser.
#
# It still uses the local throwaway Postgres, so experimenting here cannot
# touch the live menu.

services:
  admin:
    # The deps stage carries node_modules and a generated Prisma client, but no
    # compiled app — the source arrives through the mount below instead.
    build:
      target: deps
    command: npm run dev
    environment:
      # `next dev` binds to localhost by default, which nothing outside the
      # container could reach.
      HOSTNAME: 0.0.0.0
      # Docker Desktop on Windows does not deliver filesystem events across a
      # bind mount, so the watcher has to poll. Without these, edits are simply
      # never noticed and it looks as though hot reload is broken.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./admin:/app
      # These two anonymous volumes sit on top of the bind mount and keep the
      # container's own copies. node_modules was built for Linux and would be
      # replaced by the Windows one otherwise; .next must stay separate or the
      # container and any host dev server would fight over the same folder.
      - /app/node_modules
      - /app/.next

  customer:
    build:
      target: deps
    command: npm run dev
    environment:
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./customer:/app
      - /app/node_modules
      - /app/.next
